server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Espeja la regla de rewrite `/api/*` del sitio estático en Render: el navegador
    # habla siempre con este origen y nginx reenvía al contenedor de la API, así que
    # nunca hay una petición cross-origin y CORS no entra en juego.
    #
    # `proxy_pass` sin barra final conserva el URI completo (/api/...), que es lo que
    # esperan los endpoints. Con barra final nginx recortaría el prefijo y darían 404.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fallback de SPA, equivalente al rewrite `/* -> /index.html` de Render: sin esto,
    # recargar en una ruta de react-router devuelve 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
