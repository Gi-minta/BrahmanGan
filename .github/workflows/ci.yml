name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # El .slnx referencia proyectos de test externos al repo, por lo que se compilan
      # los proyectos concretos: la API (arrastra Domain, Application, Infrastructure y
      # los dos assemblies de migraciones) y el proyecto de tests unitarios.
      - name: Build (API + dependencias)
        run: dotnet build BrahmanGan.API/BrahmanGan.API.csproj -c Release

      - name: Test
        run: dotnet test tests/BrahmanGan.UnitTests/BrahmanGan.UnitTests.csproj -c Release --verbosity normal

  integration-test:
    name: Integration Tests (PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: BrahmanGanIntegration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d BrahmanGanIntegration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Aplica las migraciones de PostgreSQL contra el servicio y verifica el seed.
      - name: Integration tests
        env:
          TEST_POSTGRES_CONNECTION: "Host=localhost;Port=5432;Database=BrahmanGanIntegration;Username=postgres;Password=postgres"
        run: dotnet test tests/BrahmanGan.IntegrationTests/BrahmanGan.IntegrationTests.csproj -c Release --verbosity normal
