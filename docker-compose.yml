# docker-compose para probar BrahmanGan (API + frontend) con PostgreSQL.
#
#   docker compose up --build
#
#   Frontend (la app):  http://localhost:5173
#   API:                http://localhost:8080  (Scalar UI: /scalar)
#
# Reproduce la topología del despliegue: dos servicios separados, cada uno con su
# URL, y el frontend haciendo de proxy de /api hacia la API del lado servidor. Es el
# equivalente local de la API + el Static Site de Render con sus reglas de rewrite.
#
# Al arrancar, la API aplica automáticamente las migraciones de Postgres y siembra el
# usuario admin por defecto (email admin@brahmangan.com; la contraseña por defecto se
# define en DbInitializer y debe cambiarse tras el primer inicio de sesión).

services:
  postgres:
    image: postgres:16
    container_name: brahmangan-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: BrahmanGanDb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d BrahmanGanDb"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: BrahmanGan.API/Dockerfile
    container_name: brahmangan-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      # Selecciona PostgreSQL (sobrescribe el appsettings, que trae SqlServer por defecto).
      Database__Provider: Postgres
      ConnectionStrings__DefaultConnection_Postgres: "Host=postgres;Port=5432;Database=BrahmanGanDb;Username=postgres;Password=postgres"
      ConnectionStrings__EventStoreConnection_Postgres: "Host=postgres;Port=5432;Database=BrahmanGanDb;Username=postgres;Password=postgres"
    ports:
      - "8080:8080"
    # La imagen slim de .NET no trae curl/wget, pero sí bash: se consulta /health/live
    # con una petición HTTP mínima vía /dev/tcp.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080; printf 'GET /health/live HTTP/1.1\nHost: localhost\nConnection: close\n\n' >&3; grep -q '200' <&3"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Frontend (React + Vite servido por nginx) ────────────────────────
  web:
    build:
      context: ./BrahmanGan.Web
    container_name: brahmangan-web
    depends_on:
      api:
        condition: service_healthy
    ports:
      # 5173 es el puerto habitual del dev server de Vite, para no cambiar de URL
      # según cómo levantes el frontend.
      - "5173:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
