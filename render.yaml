# Blueprint de Render (infraestructura como código) para BrahmanGan.
#
# ⚠️ LEE ESTO ANTES DE APLICARLO
#
# Si la API y la base de datos ya existen creadas a mano en el dashboard, aplicar este
# Blueprint las ADOPTA en vez de duplicarlas, pero solo si lo que hay aquí coincide con lo
# que hay allí: en cuanto difiere algo, el Blueprint sobrescribe la configuración del
# dashboard en la siguiente sincronización. Antes de aplicarlo, compara servicio por
# servicio y ajusta lo que haga falta (nombres, región, plan).
#
# El nombre de la API debe ser exactamente el que ya tiene el servicio; aquí se asume
# `brahmangan`, deducido de https://brahmangan.onrender.com. Si el tuyo es otro, cámbialo
# o Render creará un servicio nuevo en paralelo.
#
# La base de datos NO se declara aquí a propósito: declararla intentaría crear una
# instancia nueva junto a la que ya usas. Las cadenas de conexión se pasan como secretos
# (`sync: false`), así Render conserva los valores que ya tengas puestos.

services:
  # ── API (.NET 10, contenedor) ────────────────────────────────────────
  - type: web
    name: brahmangan
    runtime: docker
    dockerfilePath: ./BrahmanGan.API/Dockerfile
    dockerContext: .
    # No toca la base de datos: sirve para liveness sin marcar caído el servicio
    # mientras se aplican las migraciones al arrancar.
    healthCheckPath: /health/live
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Database__Provider
        value: Postgres
      # Publica Scalar en /scalar estando en Production. Ponlo en false si prefieres no
      # exponer el catálogo de endpoints: se lee sin autenticación.
      - key: OpenApi__Enabled
        value: "true"
      # ── Secretos: se definen en el dashboard, nunca en este fichero ──
      #
      # Ambas cadenas deben definirse aunque apunten a la misma base de datos. Los
      # appsettings versionados ya traen un valor para EventStoreConnection_Postgres
      # (localhost + CHANGE_ME), así que dejarla sin definir no activa el fallback del
      # código: la configuración encontraría ese valor e intentaría conectar a localhost.
      #
      # Se acepta tanto el formato clave-valor de Npgsql como la URI que Render entrega
      # (postgresql://usuario:password@host:puerto/basedatos).
      - key: ConnectionStrings__DefaultConnection_Postgres
        sync: false
      - key: ConnectionStrings__EventStoreConnection_Postgres
        sync: false
      # Obligatoria en Production; mínimo 32 caracteres. Si cambia, todos los tokens
      # emitidos dejan de ser válidos.
      - key: Jwt__SecretKey
        sync: false
      # Contraseña del usuario admin semilla. Sin ella se genera una aleatoria y se
      # registra una única vez en el log de arranque.
      - key: Seed__Admin__Password
        sync: false

  # ── Frontend (React + Vite, sitio estático) ──────────────────────────
  - type: web
    name: brahmangan-web
    runtime: static
    rootDir: BrahmanGan.Web
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      # EL ORDEN IMPORTA. Esta regla va primero o el comodín de abajo se traga las
      # llamadas a la API.
      #
      # El cliente usa rutas relativas (`const BASE = '/api'`), así que Render hace de
      # proxy del lado servidor y el navegador nunca lanza una petición cross-origin:
      # no hace falta tocar CORS. Ajusta el host si el servicio de la API se llama
      # distinto.
      - type: rewrite
        source: /api/*
        destination: https://brahmangan.onrender.com/api/*
      # Fallback de SPA: sin esto, recargar en una ruta de react-router da 404.
      - type: rewrite
        source: /*
        destination: /index.html
